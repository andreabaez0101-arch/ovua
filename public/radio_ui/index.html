<!DOCTYPE html>
<html lang="en" style="background: transparent !important;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dopa - radio script</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* FiveM NUI Transparency Fix */
    html, body {
      background: transparent !important;
      background-color: transparent !important;
    }
    /* Disable dragging globally */
    * {
      -webkit-user-drag: none;
      user-select: none;
      -webkit-user-select: none;
    }
  </style>
</head>
<body style="background: transparent !important;" ondragstart="return false;" ondrop="return false;">

  <!-- Radio Users List - Always Visible (Top Right) -->
  <div id="users-list-overlay" class="users-list-overlay">
    <div class="user-item leader">
      <svg class="leader-icon" viewBox="0 0 24 24" fill="currentColor" style="color: #FFD700;">
        <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/>
      </svg>
      <span class="user-name" style="color: #FFD700;">John Doe</span>
      <div class="audio-indicator hidden">
        <span></span><span></span><span></span>
      </div>
    </div>
    <div class="user-item">
      <span class="user-name">Maria Johnson</span>
      <div class="audio-indicator hidden">
        <span></span><span></span><span></span>
      </div>
    </div>
    <div class="user-item talking">
      <span class="user-name">Carlos Martinez</span>
      <div class="audio-indicator">
        <span></span><span></span><span></span>
      </div>
    </div>
    <div class="user-item">
      <span class="user-name">Ana Rodriguez</span>
      <div class="audio-indicator hidden">
        <span></span><span></span><span></span>
      </div>
    </div>
  </div>

  <!-- Radio UI Container -->
  <div id="radio-container" class="radio-container hidden">
    <div class="radio-panel">
      <!-- Glass Reflection -->
      <div class="glass-reflection"></div>
      
      <!-- Header -->
      <div class="radio-header">
        <div class="radio-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M12 6V2m0 4a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/>
            <path d="M6.34 6.34l-2.83-2.83m17 0l-2.83 2.83M4 12H2m20 0h-2"/>
            <path d="M12 14v8M8 18h8"/>
          </svg>
        </div>
        <h2 class="radio-title">dopa - radio script</h2>
        <button class="header-btn" id="members-btn" onclick="Radio.showMembers()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
        </button>
        <button class="header-btn" id="settings-btn" onclick="Radio.showSettings()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
        <button class="header-btn" onclick="Radio.close()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <!-- Channel Display -->
      <div class="channel-display">
        <div class="channel-status">
          <span class="status-dot"></span>
          <span class="status-text">Conectado</span>
        </div>
        <div class="channel-number" id="channel-number">001</div>
        <div class="channel-name" id="channel-name">Canal Principal</div>
      </div>

      <!-- Channel Controls -->
      <div class="channel-controls">
        <button class="channel-btn" onclick="Radio.changeChannel(-1)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
        </button>
        <input type="text" class="channel-input" id="channel-input" placeholder="001" maxlength="3" onkeypress="Radio.handleChannelInput(event)">
        <button class="channel-btn" onclick="Radio.changeChannel(1)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 18l6-6-6-6"/>
          </svg>
        </button>
      </div>

      <!-- Volume Control -->
      <div class="volume-section">
        <div class="volume-header">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M11 5L6 9H2v6h4l5 4V5z"/>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
          </svg>
          <span>Volumen</span>
          <span class="volume-value" id="volume-value">75%</span>
        </div>
        <div class="volume-slider-wrapper">
          <input type="range" class="volume-slider" id="volume-slider" min="0" max="100" value="75" oninput="Radio.setVolume(this.value)">
          <div class="volume-track">
            <div class="volume-fill" id="volume-fill" style="width: 75%;"></div>
          </div>
        </div>
      </div>

      <!-- Quick Channels -->
      <div class="quick-channels">
        <div class="quick-list">
          <button class="quick-btn active" onclick="Radio.quickChannel(1)">001</button>
          <button class="quick-btn" onclick="Radio.quickChannel(2)">002</button>
          <button class="quick-btn" onclick="Radio.quickChannel(3)">003</button>
          <button class="quick-btn" onclick="Radio.quickChannel(4)">004</button>
        </div>
      </div>

      <!-- Talk Button -->
      <div class="talk-section">
        <button class="talk-btn" id="talk-btn" onmousedown="Radio.startTalk()" onmouseup="Radio.endTalk()" ontouchstart="Radio.startTalk()" ontouchend="Radio.endTalk()">
          <div class="talk-btn-glow"></div>
          <svg class="talk-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <path d="M12 19v4M8 23h8"/>
          </svg>
          <span class="talk-text">Hablar</span>
          <span class="talk-key">N</span>
        </button>
      </div>

      <!-- Footer Actions -->
      <div class="radio-footer">
        <button class="footer-btn" id="mute-btn" onclick="Radio.toggleMute()">
          <svg id="mute-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M11 5L6 9H2v6h4l5 4V5z"/>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
          </svg>
          <span id="mute-text">Silenciar</span>
        </button>
        <button class="footer-btn danger" onclick="Radio.disconnect()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M18.36 6.64a9 9 0 1 1-12.73 0"/>
            <line x1="12" y1="2" x2="12" y2="12"/>
          </svg>
          <span>Desconectar</span>
        </button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
